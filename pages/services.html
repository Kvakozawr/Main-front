<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvakozawr</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <nav class="header-nav">
                <a href="#" class="header-link">Home</a>
                <a href="#" class="header-link">Meet the team</a>
                <a href="#" class="header-link">Services</a>
                <a href="#" class="header-link">ToS</a>
                <a href="#" class="header-logo">
                    <img src="../images/logo.svg" alt="Kvakozawr logo">
                </a>
                <a href="#" class="header-link">Order</a>
                <a href="#" class="header-link">Free assets</a>
                <a href="#" class="header-link">Reviews</a>
            </nav>
        </div>
    </header>
    <main class="main">
        <div class="page services-page">
            <div class="services-page__bg">
                <img src="../images/services/bg.png" alt="">
            </div>
            <div class="page-container">
                <div class="page-header services-header">
                    <h1 class="title services-header__title">check out our services</h1>
                    <div class="title-desc services-header__desc">
                        <img src="../images/services/desc.svg" alt="">
                    </div>
                </div>
                <div class="page-main services-main">
                    <div class="services-main__list">
                        <button class="list__button">concept art & reference sheets</button>
                        <button class="list__button">vtuber model art</button>
                        <button class="list__button">emotes & stickers & panels</button>
                        <button class="list__button">live2d rigging</button>
                        <button class="list__button">vtuber rooms</button>
                        <button class="list__button">overlays & coding</button>
                        <button class="list__button">illustrations</button>
                        <button class="list__button">animated illustrations</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="copyright">© Kvakozawr Studio</div>
        <div class="footer-links">
            <a href="#" class="footer-link">
                <img src="../images/footer/kofi.svg" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/boosty.svg" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/x.svg" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/vk.png" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/youtube.svg" alt="">
            </a>
        </div>
        <div class="back-to-top">
            <div class="back-to-top__text">Back to top</div>
            <div class="back-to-top__icon">
                
            </div>
        </div>
    </footer>
    <script src = '../scripts/services.js'></script>
</body>
</html>
