<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvakozawr</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <nav class="header-nav">
                <a href="#" class="header-link">Home</a>
                <a href="#" class="header-link">Meet the team</a>
                <a href="#" class="header-link">Services</a>
                <a href="#" class="header-link">ToS</a>
                <a href="#" class="header-logo">
                    <img src="../images/logo.svg" alt="Kvakozawr logo">
                </a>
                <a href="#" class="header-link">Order</a>
                <a href="#" class="header-link">Free assets</a>
                <a href="#" class="header-link">Reviews</a>
            </nav>
        </div>
    </header>
    <main class="main main-order">
        <div class="order-page-bg">
            <div class="order-bg-wrapper">
                <div class="top-left">
                    <img src="../images/order/top-left.png" alt="">
                </div>
                <div class="bot-right">
                    <img src="../images/order/bot-right.png" alt="">
                </div>
            </div>
            <div class="left-border">
                <img src="../images/order/left-border.png" alt="">
            </div>
            <div class="dotted-lines"></div>
            <div class="right-border">
                <img src="../images/order/right-border.png" alt="">
            </div>
        </div>
        <div class="order-page">
            <div class="title order-title">here you can text us and order</div>
            <div class="title-desc order-desc">
                <img src="../images/order/desc.svg" alt="">
            </div>
            <div class="order-links">
                <div class="links-sticker">
                    <img src="../images/order/sticker.png" alt="">
                </div>
                <div class="links-buttons">
                    <button class="links-button">text us at twitter</button>
                    <button class="links-button">text us at telegram</button>
                    <button class="links-button">text us at vk</button>
                </div>
            </div>
            <div class="order-text">
                We accept orders on Twitter or Telegram or VK. Our manager will answer all questions and help to place an order.
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="copyright">© Kvakozawr Studio</div>
        <div class="footer-links">
            <a href="#" class="footer-link">
                <img src="../images/footer/kofi.svg" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/boosty.svg" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/x.svg" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/vk.png" alt="">
            </a>
            <a href="#" class="footer-link">
                <img src="../images/footer/youtube.svg" alt="">
            </a>
        </div>
        <div class="back-to-top">
            <div class="back-to-top__text">Back to top</div>
            <div class="back-to-top__icon">
                
            </div>
        </div>
    </footer>
</body>
</html>
